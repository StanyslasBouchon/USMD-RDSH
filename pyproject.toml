[project]
name = "USMD-RDSH"
version = "0.0.1.0"
description = "Default template for PDM package"
authors = [
    { name = "StanyslasBouchon", email = "51863319+StanyslasBouchon@users.noreply.github.com" },
]
dependencies = [
    "psutil>=7.2.2",
    "pytest>=9.0.2",
    "dotenv>=0.9.9",
    "ulid-py>=1.1.0",
    "pynacl>=1.6.2",
    "aioquic>=1.3.0",
    "nan-actions @ file:///${PROJECT_ROOT}/../nan-actions",
    "cryptography>=46.0",
    "pyyaml>=6.0",
]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
usmd = "usmd_rdsh.main:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pytest.ini_options]
# Both implementations: usmd_rdsh (src/) and the usmd daemon (repository root).
asyncio_mode = "strict"
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
# What the usmd daemon (repository root, see requirements.txt) needs to run its tests.
usmd-daemon = [
    "pytest-asyncio>=0.23.0",
    "asyncio-dgram>=2.1.0",
]

[tool.tox]
legacy_tox_ini = "tox.ini"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pylint.messages_control]
# R0801: duplicate-code is a false positive here — usc.py and usd.py both
# implement an update_config() method that is intentionally parallel in structure.
disable = ["R0801"]
