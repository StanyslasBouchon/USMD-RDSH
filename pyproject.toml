[project]
name = "USMD-RDSH"
version = "0.0.1"
description = "Default template for PDM package"
authors = [
    { name = "StanyslasBouchon", email = "51863319+StanyslasBouchon@users.noreply.github.com" },
]
dependencies = ["psutil>=7.2.2", "pytest>=9.0.2", "dotenv>=0.9.9", "ulid-py>=1.1.0", "pynacl>=1.6.2"]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tests"]
